products:
  WIPER_ARM_WIRE:
    product_name: "Wiper Arm Wire"
    site: "BE01"

    # Mirrors process_steps_map while staying generic for future products.
    process_levels:
      1: rolling
      2: coating
      3: patenting
      4: drawing
      5: pickling

    # ZPP_M06's MATL_GROUP is the reliable ground-truth process-step indicator for a
    # trace row (confirmed against live data, cross-checked against the row's own
    # production machine). Unlike TCTHIELEV, it is NOT sensitive to how many levels a
    # given chain happens to have (material scrapped partway through processing) nor to
    # a step occurring more than once in one chain (e.g. re-patenting) -- it always
    # names the true step for that specific row.
    matl_group_process_step:
      FG_WPC: rolling
      WIP_BZ: coating
      WIP_IP: patenting
      WIP_DD: drawing
      WIP_PI: pickling

    # Mirrors material_numbers_map.
    material_codes:
      - "102189"
      - "102292"
      - "351285"
      - "102471"
      - "234511"
      - "102454"
      - "108320"
      - "330748"
      - "108321"
      - "102481"
      - "330747"
      - "102276"
      - "334471"
      - "312703"
      - "337545"
      - "369007"
      - "364411"
      - "102451"
      - "102287"
      - "350787"
      - "234513"
      - "354123"
      - "336173"
      - "311959"

    # Step-level allowed machines (easy to maintain and re-use by route variants).
    step_machine_pool:
      rolling: [M_47006, M_410031]
      coating: [M_46157]
      patenting: [M_46100P]
      drawing: [M_45021, M_45020, M_45025, M_45024]
      pickling: [M_45030]

    # Explicit route variants transformed from your production_route examples.
    route_variants:
      - variant_id: R1
        description: "Rolling 47006 + Drawing 45021"
        by_level:
          5: M_45030
          4: M_45021
          3: M_46100P
          2: M_46157
          1: M_47006

      - variant_id: R2
        description: "Rolling 47006 + Drawing 45020"
        by_level:
          5: M_45030
          4: M_45020
          3: M_46100P
          2: M_46157
          1: M_47006

      - variant_id: R3
        description: "Rolling 410031 + Drawing 45024"
        by_level:
          5: M_45030
          4: M_45024
          3: M_46100P
          2: M_46157
          1: M_410031

validation_rules:
  - name: process_levels_must_start_at_1
    enabled: true
  - name: process_levels_must_be_contiguous
    enabled: true
  - name: process_level_steps_must_exist_in_catalog
    enabled: true
  - name: machine_refs_must_exist_in_machine_catalog
    enabled: true
  - name: machine_site_must_exist_in_sites
    enabled: true
  - name: route_variants_levels_must_match_process_levels
    enabled: true
  - name: route_variants_machine_must_match_step_machine_pool
    enabled: true
