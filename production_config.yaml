version: 2.0.0
meta:
  owner: bekaert
  description: >-
    Generic product production configuration from wire rod raw material to finished product.
    Level convention follows traceability data: level 1 is the last processing step,
    and the highest level is the initial wire rod step.
  updated_at: 2026-07-03
  level_convention:
    direction: descending
    level_1: final_step
    level_max: initial_step

systems:
  sap:
    description: data system for production, quality, material specifications, and order management etc.
  scada:
    description: server/location/part/description info for machines and sensors and time series data

